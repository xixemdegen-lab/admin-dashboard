<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="app.css" />
        <link rel="icon" href="assets/icons/Favicon.svg" type="image/svg+xml" />
        <title>Admin dashboard</title>
    </head>
    <body>
        <div id="app-container">
            <header>
                <!-- ----------------------NAV SECTION----------------- -->

                <div class="navbar">
                    <div class="navbar__logo">
                        <img src="assets/icons/logo-icon.svg" alt="logo icon" class="navbar__logo-icon" />

                        <p class="navbar__logo-text">Bysorek</p>
                    </div>

                    <ul class="navbar__nav">
                        <li><a href="#" class="navbar__nav-link navbar__nav-link--active">Dashboard</a></li>
                        <li><a href="#" class="navbar__nav-link">Reports</a></li>
                        <li><a href="#" class="navbar__nav-link">Documents</a></li>
                        <li><a href="#" class="navbar__nav-link">History</a></li>
                        <li><a href="#" class="navbar__nav-link">Contacts</a></li>
                    </ul>

                    <div class="navbar__action">
                        <div class="navbar__action-search">
                            <img src="assets/icons/icon-search.svg" alt="search icon" />
                        </div>

                        <div class="navbar__action-notification">
                            <img src="assets/icons/icon-bell.svg" alt="notification icon" />
                        </div>

                        <div class="navbar__action-avatar">
                            <div></div>
                        </div>

                        <img src="assets/icons/icon-chevron-down.svg" alt="chevron down icon" />
                    </div>
                </div>

                <!-- -------------------------------------------------------------- -->

                <div class="page__heading">
                    <div class="page__heading-title">
                        <h1>Welcome Back, <span>Sorek</span></h1>
                    </div>

                    <div class="page__heading-action">
                        <div class="date__range">
                            <input type="date" value="2026-07-29" />
                            <p>-</p>
                            <input type="date" value="2026-09-29" />
                            <img src="assets/icons/icon-chevron-down.svg" alt="chevron down icon" />
                        </div>

                        <div class="add__new">
                            <button class="add__new-btn">
                                <img src="assets/icons/icon-plus.svg" alt="add icon" />
                                Add New Wallet
                            </button>
                        </div>
                    </div>
                </div>
            </header>

            <main></main>
        </div>
    </body>
</html>
